name: Offline checks

# Runs the unit tests and the secret scan only. It makes no API calls and uses no repository
# secrets, so no credential ever exists in this workflow.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s evals/tests -v
      - name: Scan for credentials
        run: python3 evals/check_no_secrets.py
